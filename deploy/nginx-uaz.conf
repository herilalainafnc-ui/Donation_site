# /etc/nginx/sites-available/uaz-don
# Remplacez don.zurcher.edu.mg par votre domaine et php8.3 par votre version de PHP.
server {
    listen 80;
    listen [::]:80;
    server_name don.zurcher.edu.mg;

    root /var/www/uaz-don/public;
    index index.php;
    charset utf-8;

    client_max_body_size 40M;   # = post_max_size de PHP (plusieurs photos envoyées en une fois)

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Jamais d'exécution de PHP dans les fichiers téléversés
    location ^~ /uploads/ {
        location ~ \.php$ { deny all; }
        location ~ /\. { deny all; }
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /admin { return 301 /admin/; }
    location ^~ /admin/ {
        try_files $uri $uri/ /admin/index.php?$query_string;
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        }
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Seuls les deux contrôleurs frontaux sont exécutables
    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ { return 404; }

    # Fichiers cachés interdits (sauf le dossier utilisé par Let's Encrypt)
    location ~ /\.(?!well-known) { deny all; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
